<a class="card" [routerLink]="['/work', study.slug]">
  <div class="card__image">
    <img *ngIf="study.heroImage; else placeholder" [src]="study.heroImage" alt="">
    <ng-template #placeholder><span>[Project image]</span></ng-template>
  </div>

  <p class="eyebrow">{{ study.eyebrow }}</p>
  <h3 class="card__title">{{ study.title }}</h3>
  <p class="card__summary">{{ study.summary }}</p>
  <span class="card__more">Read case study <span aria-hidden="true">→</span></span>
</a>
