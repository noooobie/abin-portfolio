t-family="'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif" font-size="18" fill="#71717A">source table</text><path d="M350,548 C 420,548 420,450 480,450" fill="none" stroke="#2E4BE0" stroke-width="3"/><rect x="480" y="380" width="250" height="140" rx="12" fill="#2E4BE0" stroke="#2E4BE0" stroke-width="2"/><text x="605.0" y="446.0" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="26" font-weight="600" fill="#FFFFFF">star schema</text><text x="605.0" y="478.0" text-anchor="middle" font-family="'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif" font-size="18" fill="#DCE2FF">supporter-centric</text><line x1="730" y1="450" x2="790" y2="450" stroke="#2E4BE0" stroke-width="3"  marker-end="url(#ah)"/><rect x="800" y="250" width="330" height="400" rx="14" fill="#FFFFFF" stroke="#9AA6E8" stroke-width="2"/><text x="965" y="300" text-anchor="middle" font-family="'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#18181B">DAX donor segments</text><rect x="835" y="340" width="260" height="66" rx="10" fill="#2E4BE0"/><text x="965" y="382" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="600" fill="#FFFFFF">active</text><rect x="835" y="430" width="260" height="66" rx="10" fill="#7C8EF0"/><text x="965" y="472" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="600" fill="#FFFFFF">at risk</text><rect x="835" y="520" width="260" height="66" rx="10" fill="#C9D1F7"/><text x="965" y="562" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="600" fill="#18181B">lapsed</text><text x="60" y="820" font-family="'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif" font-size="22" font-weight="600" fill="#2E4BE0">METHOD · POWER BI + DAX + PYTHON</text